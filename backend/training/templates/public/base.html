<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Survey{% endblock %} · Training Management System</title>
<style>
  :root { --ink:#1E1B4B; --muted:#64748B; --line:#E2E8F0; --soft:#F8FAFC; --brand:#4338CA; --brand-soft:#EEF2FF;
          --accent:#F59E0B; --danger:#B91C1C; --danger-soft:#FEF2F2; --bg:#F1F5F9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         -webkit-text-size-adjust:100%; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 56px; display:flex; flex-direction:column; gap:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 24px; }
  .hero { border-top:6px solid var(--brand); }
  .eyebrow { margin:0 0 6px; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--brand); }
  h1 { margin:0 0 8px; font-size:26px; line-height:1.25; }
  .lead { margin:0; color:var(--muted); }
  .note { margin-top:14px; padding:10px 12px; border-radius:10px; font-size:14px; background:#FEF3C7; color:#92400E; }
  .alert { margin-top:14px; padding:10px 12px; border-radius:10px; font-size:14px; background:var(--danger-soft); color:var(--danger); }
  .who { display:flex; gap:8px; align-items:center; margin-top:14px; font-size:14px; color:var(--muted); }
  .who b { color:var(--ink); }
  .foot { text-align:center; font-size:12px; color:var(--muted); }
  @media (max-width:640px) { main { padding:12px 10px 40px; } .card { padding:18px 16px; } h1 { font-size:22px; } }
</style>
{% block head %}{% endblock %}
</head>
<body>
<main>
{% block content %}{% endblock %}
<p class="foot">Training Management System · {{ survey.cohort.name|default:"" }}</p>
</main>
{% block scripts %}{% endblock %}
</body>
</html>
